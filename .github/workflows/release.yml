name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - 'dev-v*.*.*'   # ← dev dry-runs: build + push under an isolated dev-v* tag only (no latest/semver)

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: world-contracts
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run full test pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: test-stage
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      
      # TODO: Add integration tests here
      # TODO: Add smoke tests for deployed contracts

  release-image:
    name: Build and Push Release Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write  
    steps:
      - uses: actions/checkout@v5
      
      # Setup QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # `latest` only for stable `v*` tags — never moved by a dev dry-run.
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}
            # Dev dry-runs still push, but only under an isolated `dev-v*` tag.
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref_name, 'dev-') }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: release-stage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Bake and push snapshot image (pre-baked container state)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.REPO_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
          METADATA_LABELS: ${{ steps.meta.outputs.labels }}
        run: ./scripts/bake-snapshot-image.sh
