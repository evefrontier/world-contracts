name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'dev-v*.*.*'   # ← dev dry-runs: build + push under an isolated dev-v* tag only (no latest/semver)

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: world-contracts
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run full CI pipeline (fmt + lint + test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ci-stage
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      
  metadata:
    name: Extract release metadata
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            # `latest` only for stable `v*` tags — never moved by a dev dry-run.
            type=raw,value=latest,enable=${{ startsWith(github.ref_name, 'v') }}
            # Dev dry-runs still push, but only under an isolated `dev-v*` tag.
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref_name, 'dev-') }}

  release-image:
    name: Build and Push Release Image
    runs-on: ubuntu-latest
    needs: [build-and-test, metadata]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Setup QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: release-stage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.tags }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  bake-snapshot:
    name: Bake and push snapshot image (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 runs on a native arm64 runner instead of QEMU emulation
          # the emulated leg of this step was ~5x slower than amd64
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build baker image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.integration
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE_NAME }}-snapshot:baker
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/world-integration:latest
            type=gha,scope=integration-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=integration-${{ matrix.arch }}

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ matrix.arch }}-

      - name: Bake and push snapshot image (pre-baked container state)
        timeout-minutes: 15
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.REPO_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          METADATA_TAGS: ${{ needs.metadata.outputs.tags }}
          METADATA_LABELS: ${{ needs.metadata.outputs.labels }}
          PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
        run: ./scripts/bake-snapshot-image.sh bake ${{ matrix.arch }}

  join-snapshot-manifest:
    name: Join multi-arch snapshot manifest
    needs: [metadata, bake-snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join per-arch snapshot images into one multi-arch manifest
        timeout-minutes: 5
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.REPO_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          METADATA_TAGS: ${{ needs.metadata.outputs.tags }}
        run: ./scripts/bake-snapshot-image.sh join
