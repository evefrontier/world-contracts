name: Publish Integration Image

# Builds the integration toolchain image (Sui + Node + pnpm + genesis assets)
# and pushes it to GHCR.
#
# Triggers:
#   - manual dispatch (ad-hoc refresh, e.g. after a Sui version bump)
#   - push to dev touching docker/** (keeps the image from going stale)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'docker/Dockerfile.integration'
      - 'docker/entrypoint-integration.sh'
      - 'docker/entrypoint-snapshot-image.sh'
      - 'docker/fullnode.yaml'
      - 'docker/genesis/**'
      - '.github/workflows/publish-integration-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/world-integration

jobs:
  publish:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.integration
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=integration-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=integration-${{ matrix.arch }}

  join:
    name: Join multi-arch manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest + sha manifests
        env:
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
