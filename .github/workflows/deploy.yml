name: Deploy World

# Deploy/upgrade an already-built, tagged image to one environment.
# workflow picks an image tag and ships exactly that artifact to a chosen env.
# The same tag can go to many envs, and different envs can run different tags.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy (e.g. v1.2.3, dev-v1.2.3)
        type: string
        required: true
      env:
        description: Target environment
        type: choice
        options: [dev, test, uat, live]
        required: true
      mode:
        description: deploy (new publish + MVR set_network) or upgrade (existing lineage, target network only)
        type: choice
        options: [upgrade, deploy]
        default: upgrade
        required: true
      version:
        description: On-chain version to record git metadata for (e.g. 1, 2)
        type: string
        default: "1"
        required: true

concurrency:
  # Serialize per env; env-keyed records mean different envs don't collide.
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: world-contracts

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.env }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve config
        id: cfg
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ inputs.image_tag }}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          case "${{ inputs.env }}" in
            dev|test|uat) echo "net=testnet" >> "$GITHUB_OUTPUT" ;;
            live)         echo "net=mainnet" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pinned image
        run: docker pull "${{ steps.cfg.outputs.image }}"

      # Drive the deploy scripts inside the pinned image (Sui + tooling baked in),
      # overriding the publish-only entrypoint. The workspace is mounted so the
      # records the scripts write (Published.toml, world.json) land on the
      # runner for commit. Keys are imported into a per-run sui config.
      - name: Deploy / upgrade on-chain (+ MVR)
        env:
          # On testnet the deployer also holds the AppCaps, so one key signs both
          # the target-network steps and mainnet set_network.
          DEPLOYER_KEY: ${{ secrets.SUI_DEPLOYER_KEY }}
          APPCAP_KEY: ${{ secrets.SUI_APPCAP_KEY }}
          TARGET_ENV: ${{ inputs.env }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          NET: ${{ steps.cfg.outputs.net }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CI=true \
            -e DEPLOYER_KEY -e APPCAP_KEY \
            -e TARGET_ENV -e MODE -e VERSION -e NET \
            -e COMMIT="${{ github.sha }}" \
            --entrypoint bash \
            "${{ steps.cfg.outputs.image }}" \
            scripts/ci-deploy.sh

      - name: Open deployment records PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A \
            contracts/core/Published.toml contracts/character/Published.toml \
            "deployments/${{ inputs.env }}/world.json"
          if git diff --cached --quiet; then
            echo "No record changes to commit."
            exit 0
          fi
          branch="deploy-records/${{ inputs.env }}-${{ github.run_id }}"
          title="deploy(${{ inputs.env }}): ${{ inputs.image_tag }}"
          git commit -m "$title [skip ci]"
          git push origin "HEAD:${branch}"
          gh pr create \
            --base dev \
            --head "$branch" \
            --title "$title" \
            --body "Automated deployment records for \`${{ inputs.env }}\` from image \`${{ inputs.image_tag }}\` (mode: ${{ inputs.mode }}, version: ${{ inputs.version }}, commit: ${{ github.sha }})."
