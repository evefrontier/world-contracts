name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - dev 

env:
  CONTRACTS_DIR: contracts

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run formatter check
        run: pnpm run fmt:check

  sdk:
    name: SDK (format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:ts:check

      - name: Typecheck
        run: pnpm --filter @evefrontier/world-sdk typecheck

  lint-contracts:
    strategy:
      matrix:
        package: [core, character]
    name: Lint ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      
      - name: Lint ${{ matrix.package }}
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            sui move build --build-env testnet --path ${{ env.CONTRACTS_DIR }}/${{ matrix.package }} --lint

  build:
    strategy:
      matrix:
        package: [core, character]
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: lint-contracts
    steps:
      - uses: actions/checkout@v5
      
      - name: Build ${{ matrix.package }}
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            sui move build --build-env testnet --path ${{ env.CONTRACTS_DIR }}/${{ matrix.package }}

  test:
    strategy:
      matrix:
        package: [core, character]
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: lint-contracts
    steps:
      - uses: actions/checkout@v5
      
      - name: Test ${{ matrix.package }}
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            sui move test --build-env testnet --path ${{ env.CONTRACTS_DIR }}/${{ matrix.package }}