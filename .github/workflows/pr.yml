name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  sdk:
    name: SDK (format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:ts:check

      - name: Typecheck
        run: pnpm --filter @evefrontier/world-sdk typecheck

      - name: Test
        run: pnpm --filter @evefrontier/world-sdk test

  contracts:
    name: Contracts (format, lint, test)
    runs-on: ubuntu-latest
    # Pinned Sui toolchain — keep in sync with docker/ (see docker/README.md).
    container:
      image: mysten/sui-tools:testnet-v1.69.1
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  integration:
    name: Integration tests (localnet)
    runs-on: ubuntu-latest
    # Heavy job (builds image + spins localnet) — only run once the cheaper
    # unit/build checks pass. v1 integration is simulation-only, so it is safe
    # to gate merges on it pre-merge.
    needs: [sdk, contracts]
    steps:
      - uses: actions/checkout@v5

      - name: Build integration image
        run: docker build -f docker/Dockerfile.integration -t world-integration .

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CI=true \
            world-integration test
