name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run lint:ts:check

      - name: Typecheck
        run: pnpm --filter @evefrontier/world-sdk typecheck

      - name: Test
        run: pnpm --filter @evefrontier/world-sdk test

  contracts:
    name: Contracts (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format, lint & test contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ci-stage
          push: false
          cache-from: type=gha,scope=contracts
          cache-to: type=gha,mode=max,scope=contracts

  integration:
    name: Integration tests (localnet)
    runs-on: ubuntu-latest
    # Heavy job (builds image + spins localnet) — only run once the cheaper
    # unit/build checks pass. v1 integration is simulation-only, so it is safe
    # to gate merges on it pre-merge. Skipped while the PR is a draft so commits
    # can iterate freely; mark the PR ready for review to run it.
    if: github.event.pull_request.draft == false
    needs: [sdk, contracts]
    permissions:
      contents: read
      packages: read
    env:
      # Pin digest (not :latest). Bump after a successful Publish Integration Image run.
      IMAGE: ghcr.io/${{ github.repository_owner }}/world-integration:c1411d6ff68cd5a6911dae28717e3304223debe3@sha256:1b0ac67f43942179a658748e6567de3b57132d102787ada1ab72414d04d54afd
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull integration image
        run: docker pull "$IMAGE"

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CI=true \
            "$IMAGE" test
