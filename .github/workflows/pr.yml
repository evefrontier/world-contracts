name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  sdk:
    name: SDK (format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:ts:check

      - name: Typecheck
        run: pnpm --filter @evefrontier/world-sdk typecheck

      - name: Test
        run: pnpm --filter @evefrontier/world-sdk test

  contracts:
    name: Contracts (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format, lint & test contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ci-stage
          push: false
          cache-from: type=gha,scope=contracts
          cache-to: type=gha,mode=max,scope=contracts

  integration:
    name: Integration tests (localnet)
    runs-on: ubuntu-latest
    # Heavy job (builds image + spins localnet) — only run once the cheaper
    # unit/build checks pass. v1 integration is simulation-only, so it is safe
    # to gate merges on it pre-merge.
    needs: [sdk, contracts]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build integration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.integration
          tags: world-integration:latest
          load: true
          cache-from: type=gha,scope=integration
          cache-to: type=gha,mode=max,scope=integration

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CI=true \
            world-integration:latest test
