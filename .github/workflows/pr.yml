name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run formatter check
        run: pnpm run fmt:check

  build:
    name: Build All Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Build contracts with Sui Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            bash -c 'find contracts -maxdepth 1 -mindepth 1 -type d | xargs -P 4 -I {} sui move build --path {}'

  test:
    name: Test All Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Test contracts with Sui Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            bash -c 'find contracts -maxdepth 1 -mindepth 1 -type d | xargs -P 4 -I {} sui move test --path {}'