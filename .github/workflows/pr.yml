name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

env:
  CONTRACTS_DIR: contracts
  PARALLEL_JOBS: 4

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run formatter check
        run: pnpm run fmt:check
      
      - name: Lint Move contracts
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            bash -c 'find ${{ env.CONTRACTS_DIR }} -maxdepth 1 -mindepth 1 -type d | xargs -P ${{ env.PARALLEL_JOBS }} -I {} sui move build --path {} --lint'

  build:
    name: Build All Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Build contracts with Sui Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            bash -c 'find ${{ env.CONTRACTS_DIR }} -maxdepth 1 -mindepth 1 -type d | xargs -P ${{ env.PARALLEL_JOBS }} -I {} sui move build --path {}'

  test:
    name: Test All Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Test contracts with Sui Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            mysten/sui-tools:testnet \
            bash -c 'find ${{ env.CONTRACTS_DIR }} -maxdepth 1 -mindepth 1 -type d | xargs -P ${{ env.PARALLEL_JOBS }} -I {} sui move test --path {}'