name: Deploy Currency

# Deploy/upgrade the EVE currency package independently of world redeploys.
# Same image-tag model as Deploy World; MVR names are @evefrontier/currency[-env].

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy (e.g. v1.2.3, dev-v1.2.3)
        type: string
        required: true
      env:
        description: Target environment
        type: choice
        options: [dev, test, uat, live]
        required: true
      mode:
        description: deploy (new publish + MVR set_network) or upgrade (existing lineage)
        type: choice
        options: [upgrade, deploy]
        default: deploy
        required: true
      version:
        description: On-chain version to record git metadata for (e.g. 1, 2)
        type: string
        default: "1"
        required: true

concurrency:
  group: deploy-currency-${{ inputs.env }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: world-contracts

jobs:
  deploy:
    name: Currency ${{ inputs.image_tag }} → ${{ inputs.env }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve config
        id: cfg
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ inputs.image_tag }}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          case "${{ inputs.env }}" in
            dev|test|uat) echo "net=testnet" >> "$GITHUB_OUTPUT" ;;
            live)         echo "net=mainnet" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pinned image
        run: docker pull "${{ steps.cfg.outputs.image }}"

      - name: Deploy / upgrade currency (+ MVR)
        env:
          DEPLOYER_KEY: ${{ secrets.SUI_DEPLOYER_KEY }}
          APPCAP_KEY: ${{ secrets.SUI_APPCAP_KEY }}
          TARGET_ENV: ${{ inputs.env }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          NET: ${{ steps.cfg.outputs.net }}
          CONTAINER: deploy-currency-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env="${{ inputs.env }}"
          if [[ ! -f "deployments/$env/world.json" ]]; then
            echo "ERROR: deployments/$env/world.json missing — needed for mvr.currency.appCap" >&2
            exit 1
          fi
          docker create --name "$CONTAINER" \
            -e CI=true \
            -e DEPLOYER_KEY -e APPCAP_KEY \
            -e TARGET_ENV -e MODE -e VERSION -e NET \
            -e COMMIT="${{ github.sha }}" \
            --entrypoint bash \
            "${{ steps.cfg.outputs.image }}" \
            -c "mkdir -p deployments/$env && cat /app/world.json.seed > deployments/$env/world.json && rm -f /app/world.json.seed && scripts/ci-deploy-currency.sh"
          docker cp "deployments/$env/world.json" "$CONTAINER:/app/world.json.seed"
          docker start -a "$CONTAINER"

          tmp="$(mktemp -d)"
          docker cp "$CONTAINER:/app/deployments/$env/records/." "$tmp/"
          cp -r "$tmp/contracts/." contracts/
          mkdir -p "deployments/$env"
          cp "$tmp/world.json" "deployments/$env/world.json"
          rm -rf "$tmp"

      - name: Remove deploy container
        if: always()
        run: docker rm -f "deploy-currency-${{ github.run_id }}-${{ github.run_attempt }}" 2>/dev/null || true

      - name: Open deployment records PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A \
            'contracts/currency/Published.toml' \
            "deployments/${{ inputs.env }}/world.json"
          if git diff --cached --quiet; then
            echo "No record changes to commit."
            exit 0
          fi
          branch="deploy-currency-records/${{ inputs.env }}-${{ github.run_id }}"
          title="deploy-currency(${{ inputs.env }}): ${{ inputs.image_tag }}"
          git commit -m "$title [skip ci]"
          git push origin "HEAD:${branch}"
          gh pr create \
            --base dev \
            --head "$branch" \
            --title "$title" \
            --body "Automated currency deployment records for \`${{ inputs.env }}\` from image \`${{ inputs.image_tag }}\` (mode: ${{ inputs.mode }}, version: ${{ inputs.version }}, commit: ${{ github.sha }})." \
            || echo "PR creation blocked; open one from: https://github.com/${{ github.repository }}/compare/dev...${branch}?expand=1"
