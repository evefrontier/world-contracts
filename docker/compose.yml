# Build and run the release image locally as a deploy vehicle.
# Reads credentials/target from ../.env (SUI_NETWORK, DEPLOYER_PRIVATE_KEY).
#
#   docker compose -f docker/compose.yml run --rm deploy
services:
  deploy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: release-stage
    image: world-contracts:latest
    volumes:
      - ../.env:/app/.env:ro
      - ../deployments:/app/deployments
