# This is an example of how to use the snapshot image to start a localnet with indexer and graphql.
#
# The snapshot includes deployed packages plus seeded PLAYER_A/B/C characters
# (see repo-root test-resources.json). On start the container copies world.json,
# accounts.json, and test-resources.json into the host mount.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sui:
    image: ghcr.io/evefrontier/world-contracts:latest-snapshot
    ports:
      - 9000:9000
      - 9123:9123
      - 9125:9125
    volumes:
      # Host folder for the deployment artifacts. On start the container copies the baked
      # world.json, accounts.json, and test-resources.json from the image into this mount
      # (see entrypoint-snapshot-image.sh), so they appear on the host under
      # ../deployments/localnet-snapshot/. Needs :rw for that.
      - ../deployments/localnet-snapshot:/data/deployment:rw
    environment:
      POSTGRES_CONNECTION_STRING: "postgres://postgres:postgres@postgres:5432/postgres"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:9000/rpc.discover > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
