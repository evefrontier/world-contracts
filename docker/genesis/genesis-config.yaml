---
# Deterministic localnet genesis PARAMETERS for world-contracts Docker images.
#
# This file holds only the genesis tuning. The `accounts:` funding block is NOT
# here — the integration entrypoint appends it at runtime from the addresses in
# accounts.json (the single source of truth for the test keys and addresses).
ssfn_config_info: ~
validator_config_info: ~
parameters:
  chain_start_timestamp_ms: 0
  protocol_version: 130  # Scratchpad (sui::scratch) starts here. Must be <= the max
                         # protocol version the pinned SUI_VERSION binary supports.
  allow_insertion_of_extra_objects: true
  epoch_duration_ms: 86400000
  stake_subsidy_start_epoch: 0
  stake_subsidy_initial_distribution_amount: 1000000000000000
  stake_subsidy_period_length: 10
  stake_subsidy_decrease_rate: 1000
